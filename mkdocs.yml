site_name: 诺文斯克日报
site_description: 塔科夫每日速览 —— 官方改动 · 社区风向 · 萌新提示
site_author: B站 UID:81597119
site_url: https://tarkov-daily.pages.dev/
repo_url: https://github.com/DrNetzach/tarkov-daily
repo_name: DrNetzach/tarkov-daily

theme:
  name: material
  language: zh
  icon:
    logo: material/newspaper-variant-outline
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗黑模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: zh
  - blog:
      blog_dir: blog
      post_url_format: "{date}/{slug}"
      post_date_format: full
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags

nav:
  - 首页: index.md
  - 日报: blog/index.md
  - 关于: about.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
